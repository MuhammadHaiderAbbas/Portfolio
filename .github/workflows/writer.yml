name: AI writer

# Twice a day: finds trending topics in your fields and writes one article.
# A separate editor pass checks safety and quality; articles that pass publish
# themselves one hour after the email (you can hold them), the rest wait for you.
on:
  # Morning (about 7:40 UK time in winter, 8:40 in summer) and evening (about 18:40 / 19:40)
  schedule:
    - cron: '41 7 * * *'
    - cron: '41 18 * * *'
  # "Find topics" / "Write an article now" buttons in the admin panel
  repository_dispatch:
    types: [ai-writer]
  # Manual run from the Actions tab
  workflow_dispatch:
    inputs:
      mode:
        description: 'trends = find topics only, write = write the next article now, auto = daily routine'
        type: choice
        options: [write, trends, auto]
        default: write

permissions:
  contents: read
  # Free AI fallback: GitHub Models, using this workflow's own token
  models: read

concurrency:
  group: ai-writer
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true

      - name: Run the writer
        run: node scripts/writer.mjs "$WRITER_MODE"
        env:
          WRITER_MODE: ${{ github.event.inputs.mode || github.event.client_payload.mode || 'auto' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional free fallbacks (add any of these as repository secrets)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
